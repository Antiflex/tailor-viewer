<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Visualiseur 3D</title>
    <style>
        :root {
            --bg: #16181c;
            --bg-grad: linear-gradient(160deg, #1b1e24 0%, #14161a 55%, #101216 100%);
            --panel-grad: linear-gradient(180deg, rgba(255,255,255,0.055) 0%, rgba(255,255,255,0.02) 100%);
            --panel-border: rgba(255, 255, 255, 0.07);
            --tile: rgba(255, 255, 255, 0.045);
            --tile-hover: rgba(255, 255, 255, 0.085);
            --text: #e6e8ec;
            --text2: #9aa0ab;
            --accent: #8fb4c9;
            --accent-soft: rgba(143, 180, 201, 0.16);
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: var(--bg) var(--bg-grad) fixed;
            font-family: system-ui, -apple-system, sans-serif;
            color: var(--text);
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        #hud-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            pointer-events: none;
        }

        #right-panel {
            position: absolute;
            right: 20px;
            top: 20px;
            width: 340px;
            max-height: calc(100% - 40px);
            background: var(--bg) var(--panel-grad);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
            overflow: hidden;
        }

        .panel-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

            .panel-header h2 {
                margin: 0;
                font-size: 14px;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.8px;
            }

        #legend-content {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .legend-item {
            margin-bottom: 8px;
            padding: 12px 15px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            border-left: 4px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
        }

            .legend-item:hover {
                background: rgba(255,255,255,0.06);
            }

            .legend-item.selected {
                background: rgba(78, 168, 222, 0.15);
                box-shadow: inset 0 0 0 1px var(--accent);
            }

            .legend-item.hidden-item {
                opacity: 0.4;
            }

        .visibility-toggle {
            opacity: 0.6;
        }

            .visibility-toggle:hover {
                opacity: 1;
            }

            .visibility-toggle.off {
                filter: grayscale(1) opacity(0.3);
            }

        .paired-sides-row {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .side-pill {
            flex: 1;
            padding: 6px 8px;
            background: rgba(0,0,0,0.2);
            border-radius: 6px;
            border: 1px solid transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

            .side-pill:hover {
                background: rgba(0,0,0,0.4);
            }

            .side-pill.active-edit {
                background: rgba(78, 168, 222, 0.2);
                border-color: var(--accent);
            }

            .side-pill.side-hidden {
                opacity: 0.3;
            }

        .side-check-label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        #controls-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 400px;
            background: var(--bg) var(--panel-grad);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            padding: 20px;
            box-sizing: border-box;
            z-index: 20;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
            transition: opacity 0.3s, transform 0.3s;
        }

            #controls-panel.hidden {
                opacity: 0;
                pointer-events: none;
                transform: translateY(10px);
            }

        .control-group {
            margin-bottom: 15px;
        }

        .control-header {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            margin-bottom: 8px;
            color: var(--text2);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        input[type="range"] {
            width: 100%;
            -webkit-appearance: none;
            background: rgba(255,255,255,0.1);
            height: 4px;
            border-radius: 2px;
            outline: none;
            margin: 10px 0;
        }

            input[type="range"]::-webkit-slider-thumb {
                -webkit-appearance: none;
                width: 14px;
                height: 14px;
                border-radius: 50%;
                background: var(--accent);
                cursor: pointer;
                transition: transform 0.1s;
            }

                input[type="range"]::-webkit-slider-thumb:hover {
                    transform: scale(1.3);
                }

        .btn-action {
            background: var(--tile);
            border: 1px solid var(--panel-border);
            color: var(--text);
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

            .btn-action:hover {
                background: var(--tile-hover);
            }

        .btn-action {
            width: 100%;
            padding: 8px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            color: var(--text);
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

            .btn-action:hover {
                background: rgba(255,255,255,0.1);
            }

        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: var(--bg);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(78, 168, 222, 0.2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
        }

            ::-webkit-scrollbar-thumb:hover {
                background: rgba(255,255,255,0.2);
            }
    </style>

    <!-- IMPORT MAP: Permet d'importer Three.js nativement sans compilateur Vite/Webpack -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <div id="loading-text" style="color: #888; font-size: 14px;">Chargement du modèle...</div>
    </div>

    <div id="canvas-container"></div>
    <canvas id="hud-canvas"></canvas>

    div id="right-panel">
    <div class="panel-header legend-header">
        <h2 data-i18n="measurementsTitle">Mensurations</h2>
    </div>
    <div id="legend-content"></div>
    </div> <!-- FIN DU RIGHT PANEL ICI -->
    <!-- PANNEAU DE CONTRÔLE INDÉPENDANT EN BAS À GAUCHE -->
    <div id="controls-panel" class="hidden">
        <div style="font-size: 14px; font-weight: 600; margin-bottom: 15px; display: flex; justify-content: space-between;">
            <span data-i18n="tailorAdjustTitle">Ajustement Tailleur</span>
            <button id="btn-reset-slider" class="btn-action" style="width: auto; padding: 2px 8px;">Reset</button>
        </div>

        <div class="control-group">
            <div class="control-header">
                <span>Hauteur (T)</span>
                <span style="font-size: 10px;">Haut / Bas</span>
            </div>
            <input type="range" id="slider-t" min="0" max="1" step="0.001" value="0.5">
        </div>

        <div class="control-group">
            <div class="control-header">
                <span>Inclinaison Avant/Arrière</span>
                <span id="label-val-theta" style="color: var(--accent); font-weight: bold;">0.0°</span>
            </div>
            <input type="range" id="slider-theta" min="-15" max="15" step="0.1" value="0">
        </div>

        <div class="control-group" style="margin-bottom: 0;">
            <div class="control-header">
                <span>Inclinaison Gauche/Droite</span>
                <span id="label-val-phi" style="color: var(--accent); font-weight: bold;">0.0°</span>
            </div>
            <input type="range" id="slider-phi" min="-15" max="15" step="0.1" value="0">
        </div>
    </div>

    <script type="module" src="./viewer.js"></script>

</body>
</html>
