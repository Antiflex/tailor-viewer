<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Visualiseur 3D</title>
    <style>
        :root {
            --bg: #16181c;
            --bg-grad: linear-gradient(160deg, #1b1e24 0%, #14161a 55%, #101216 100%);
            --panel-grad: linear-gradient(180deg, rgba(255,255,255,0.055) 0%, rgba(255,255,255,0.02) 100%);
            --panel-border: rgba(255, 255, 255, 0.07);
            --tile: rgba(255, 255, 255, 0.045);
            --tile-hover: rgba(255, 255, 255, 0.085);
            --text: #e6e8ec;
            --text2: #9aa0ab;
            --accent: #8fb4c9;
            --accent-marker: #e2a054;
            --accent-soft: rgba(143, 180, 201, 0.16);
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: var(--bg) var(--bg-grad) fixed;
            font-family: system-ui, -apple-system, sans-serif;
            color: var(--text);
        }

        #canvas-container, #hud-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }

        #canvas-container {
            z-index: 1;
        }

        #hud-canvas {
            z-index: 2;
            pointer-events: none;
        }

        /* --- LEGEND PANEL (DROITE) --- */
        #right-panel {
            position: absolute;
            right: 20px;
            top: 20px;
            width: 340px;
            max-height: calc(100% - 40px);
            background: var(--bg) var(--panel-grad);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
            overflow: hidden;
        }

        .panel-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

            .panel-header h2 {
                margin: 0;
                font-size: 14px;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.8px;
            }

        #legend-content {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .legend-item {
            margin-bottom: 8px;
            padding: 12px 15px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            border-left: 4px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
        }

            .legend-item:hover {
                background: rgba(255,255,255,0.06);
            }

            .legend-item.selected {
                background: rgba(78, 168, 222, 0.15);
                box-shadow: inset 0 0 0 1px var(--accent);
            }

            .legend-item.hidden-item {
                opacity: 0.4;
            }

        .visibility-toggle {
            opacity: 0.6;
        }

            .visibility-toggle:hover {
                opacity: 1;
            }

            .visibility-toggle.off {
                filter: grayscale(1) opacity(0.3);
            }

        .paired-sides-row {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .side-pill {
            flex: 1;
            padding: 6px 8px;
            background: rgba(0,0,0,0.2);
            border-radius: 6px;
            border: 1px solid transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

            .side-pill:hover {
                background: rgba(0,0,0,0.4);
            }

            .side-pill.active-edit {
                background: rgba(78, 168, 222, 0.2);
                border-color: var(--accent);
            }

            .side-pill.side-hidden {
                opacity: 0.3;
            }

        .side-check-label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        /* --- CONTROLS PANEL (GAUCHE) AVEC MARQUEURS --- */
        #controls-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 400px;
            background: var(--bg) var(--panel-grad);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            padding: 20px;
            box-sizing: border-box;
            z-index: 20;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
            transition: opacity 0.3s, transform 0.3s;
        }

            #controls-panel.hidden {
                opacity: 0;
                pointer-events: none;
                transform: translateY(10px);
            }

        .controls-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

            .controls-header h4 {
                margin: 0;
                font-size: 14px;
                font-weight: 600;
                text-transform: uppercase;
                color: var(--text);
            }

        .sliders-layout {
            display: flex;
            gap: 20px;
        }

        /* Wrappers des sliders pour accueillir les marqueurs */
        .slider-track-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

            .slider-track-wrapper.horiz {
                width: 100%;
                height: 30px;
            }

        /* Les containers de marqueurs absolus */
        .markers-container {
            position: absolute;
            pointer-events: none;
            z-index: 5;
        }

            .markers-container.horiz {
                left: 0;
                right: 0;
                top: 0;
                height: 100%;
            }

        /* Les traits de marqueurs */
        .marker {
            position: absolute;
            pointer-events: auto;
            cursor: pointer;
            transition: transform 0.1s;
        }

            .marker:hover {
                transform: scale(1.3);
                z-index: 10;
            }

            .marker.default-marker {
                background: var(--accent);
            }

            .marker.custom-marker {
                background: var(--accent-marker);
                border: 1px solid #fff;
            }

        /* Disposition Verticale */
        .vertical-slider-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 200px;
            padding-right: 15px;
            border-right: 1px solid var(--panel-border);
        }

        .slider-track-wrapper:not(.horiz) {
            height: 140px;
            width: 30px;
        }

        .markers-container:not(.horiz) {
            top: 0;
            bottom: 0;
            left: 0;
            width: 100%;
        }

        .marker.vertical-m {
            width: 12px;
            height: 3px;
            left: -6px;
            transform: translateY(-50%);
            border-radius: 2px;
        }

        /* Hack CSS Slider Vertical */
        input[type=range][orient=vertical] {
            writing-mode: vertical-lr;
            direction: rtl;
            width: 8px;
            height: 140px;
            padding: 0;
            margin: 0;
            vertical-align: bottom;
        }

        /* Disposition Horizontale */
        .horizontal-sliders-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 15px;
        }

        .horiz-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .slider-label {
            font-size: 11px;
            color: var(--text2);
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type=range]:not([orient=vertical]) {
            width: 100%;
            margin: 0;
        }

        .marker.horizontal-m {
            width: 3px;
            height: 12px;
            top: -6px;
            transform: translateX(-50%);
            border-radius: 2px;
        }

        /* Design Webkit Sliders */
        input[type="range"] {
            -webkit-appearance: none;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            outline: none;
            position: relative;
            z-index: 10;
        }

            input[type="range"]::-webkit-slider-thumb {
                -webkit-appearance: none;
                width: 16px;
                height: 16px;
                border-radius: 50%;
                background: var(--accent);
                cursor: pointer;
                transition: transform 0.1s;
            }

                input[type="range"]::-webkit-slider-thumb:hover {
                    transform: scale(1.2);
                }

        .btn-action {
            background: var(--tile);
            border: 1px solid var(--panel-border);
            color: var(--text);
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

            .btn-action:hover {
                background: var(--tile-hover);
            }

        /* Loading */
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: var(--bg);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(78, 168, 222, 0.2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
        }

            ::-webkit-scrollbar-thumb:hover {
                background: rgba(255,255,255,0.2);
            }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <div id="loading-text" style="color: #888; font-size: 14px;">Chargement du modèle...</div>
    </div>

    <div id="canvas-container"></div>
    <canvas id="hud-canvas"></canvas>

    <div id="right-panel">
        <div class="panel-header legend-header">
            <h2 data-i18n="measurementsTitle">Mensurations</h2>
        </div>
        <div id="legend-content"></div>
    </div>

    <div id="controls-panel" class="hidden">
        <div class="controls-header">
            <h4>Ajustement Tailleur</h4>
            <button id="btn-reset-slider" class="btn-action" title="Revenir au défaut">↺ Reset</button>
        </div>

        <div class="sliders-layout">
            <!-- Slider Vertical : Hauteur (T) -->
            <div class="vertical-slider-container">
                <span class="slider-label">Taille haute</span>
                <div class="slider-track-wrapper">
                    <input type="range" id="slider-t" min="0" max="1" step="0.001" value="0.5" orient="vertical">
                    <div id="markers-container-t" class="markers-container"></div>
                </div>
                <span class="slider-label">Taille basse</span>
            </div>

            <!-- Sliders Horizontaux : Angles de -limite a +limite -->
            <div class="horizontal-sliders-container">
                <div class="horiz-group">
                    <span class="slider-label">Inclinaison Avant/Arrière (Theta : <strong id="label-val-theta" style="color: var(--accent);">0.0°</strong>)</span>
                    <div class="slider-track-wrapper horiz">
                        <input type="range" id="slider-theta" min="-12" max="12" step="0.1" value="0">
                        <div id="markers-container-theta" class="markers-container horiz"></div>
                    </div>
                </div>

                <div class="horiz-group">
                    <span class="slider-label">Inclinaison Gauche/Droite (Phi : <strong id="label-val-phi" style="color: var(--accent);">0.0°</strong>)</span>
                    <div class="slider-track-wrapper horiz">
                        <input type="range" id="slider-phi" min="-12" max="12" step="0.1" value="0">
                        <div id="markers-container-phi" class="markers-container horiz"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="./viewer.js"></script>

</body>
</html>
